# Nginx configuration for Hermes Proxy Reverse Proxy
# Place this in /etc/nginx/sites-available/hermes-proxy
# Then enable with: ln -s /etc/nginx/sites-available/hermes-proxy /etc/nginx/sites-enabled/
# And reload: nginx -t && systemctl reload nginx

# Note: Replace YOUR_DOMAIN with your actual domain (e.g., myhermes.xyz-xyz.party)
# And replace YOUR_SERVER_IP with your server's IP address

server {
    listen 80;
    server_name myhermes.xyz-xyz.party;
    
    # Redirect HTTP to HTTPS (uncomment if you have SSL)
    # return 301 https://$server_name$request_uri;
    
    # Location block for the Hermes proxy
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

